# Render Blueprint: one Node web service that serves both the API and the built web app.
# Free plan has no persistent disk, so the SQLite database is reseeded with the demo
# catalogue on each deploy/restart (saved personal libraries are lost). For persistence,
# switch to a paid plan, add the disk below, and keep DATABASE_PATH pointing into it.
services:
  - type: web
    name: library3d
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (then add: - key: DATABASE_PATH, value: /var/data/library.db)
